# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, develop, feat/*, fix/*]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # Cover both GA macOS arm64 images (macos-15 and macos-26) explicitly during
          # GitHub's macos-latest migration window -- macos-latest is heterogeneous
          # mid-migration. The prebuilt CRAN TMB binary intermittently fails to load on
          # BOTH images with "symbol not found in flat namespace '_omp_get_max_threads'"
          # (it references OpenMP but nothing links libomp), so the "Rebuild TMB from
          # source against libomp" step below repairs every macOS leg.
          - {os: macos-15,       r: 'release'}
          - {os: macos-26,       r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Cap thread fan-out so the parallel testthat workers don't oversubscribe the
      # runner's cores and starve the GitHub runner agent of CPU (the documented
      # "lost-communication"/SIGTERM cause). See project_ci_oom_diagnosis.
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      BLIS_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
      R_DATATABLE_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Work around ubuntu apt azure-cli repo 403
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/azure-cli.sources || true
          sudo apt-get update

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Rebuild TMB from source against libomp (macOS)
        # The prebuilt CRAN TMB binary intermittently fails to load on the macOS arm64
        # runners with "symbol not found in flat namespace '_omp_get_max_threads'" -- it
        # references OpenMP but nothing links/loads libomp. Install libomp and rebuild
        # TMB from source so TMB.so carries a real libomp dependency. Runs on every macOS
        # leg (15 and 26). OMP_NUM_THREADS=1 (above) keeps it single-threaded.
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          brew install libomp
          LOMP="$(brew --prefix libomp)"
          mkdir -p ~/.R
          {
            echo "CPPFLAGS += -Xclang -fopenmp -I${LOMP}/include"
            echo "LDFLAGS += -L${LOMP}/lib -lomp -Wl,-rpath,${LOMP}/lib"
          } >> ~/.R/Makevars
          Rscript -e 'install.packages("TMB", type = "source", repos = "https://cloud.r-project.org", lib = .libPaths()[1])'
          # Confirm TMB.so now links libomp and actually loads (fail fast otherwise).
          Rscript -e 'so <- system.file("libs", "TMB.so", package = "TMB"); cat("TMB.so:", so, "\n"); cat(system2("otool", c("-L", so), stdout = TRUE), sep = "\n"); library(TMB); cat("TMB", as.character(packageVersion("TMB")), "loads OK\n")'
        shell: bash

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
