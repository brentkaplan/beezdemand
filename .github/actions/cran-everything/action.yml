name: CRAN Everything
description: Build and check the package like a CRAN release candidate (optionally with PDF manual), and optionally build pkgdown.

inputs:
  mode:
    description: '"check" runs R CMD build + R CMD check; "pkgdown" runs pkgdown build.'
    required: true
  r-version:
    description: R version to use (passed to r-lib/actions/setup-r).
    required: false
    default: release
  run-lint:
    description: If "true" (Linux only), run lintr::lint_package().
    required: false
    default: "false"
  run-urlcheck:
    description: If "true" (Linux only), run urlchecker::url_check().
    required: false
    default: "false"
  check-args:
    description: Arguments passed to R CMD check (e.g., --as-cran).
    required: false
    default: --as-cran
  build-manual:
    description: If "true", install TinyTeX and build the PDF manual (R CMD build --manual).
    required: false
    default: "false"
  pkgdown-dest:
    description: Destination directory for pkgdown output.
    required: false
    default: docs

runs:
  using: composite
  steps:
    - uses: r-lib/actions/setup-pandoc@v2

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ inputs.r-version }}
        use-public-rspm: true

    - name: Setup TinyTeX (PDF manual)
      if: ${{ inputs.mode == 'check' && inputs.build-manual == 'true' }}
      uses: r-lib/actions/setup-tinytex@v2

    - name: Install dependencies (check)
      if: ${{ inputs.mode == 'check' }}
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        needs: check
        extra-packages: any::lintr any::urlchecker

    - name: Install dependencies (pkgdown)
      if: ${{ inputs.mode == 'pkgdown' }}
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        needs: website
        extra-packages: any::pkgdown local::.

    - name: Rebuild TMB from source against libomp (macOS)
      # macOS arm64 runners' prebuilt CRAN TMB binary fails to load with "symbol not
      # found in flat namespace '_omp_get_max_threads'" (it references OpenMP but links
      # no libomp). Install libomp and rebuild TMB from source so TMB.so links a real
      # libomp.dylib. Mirrors the same fix in R-CMD-check.yaml; the pkgdown job runs on
      # Linux so this only fires in the macOS check legs.
      if: ${{ runner.os == 'macOS' }}
      run: |
        set -euxo pipefail
        brew install libomp
        LOMP="$(brew --prefix libomp)"
        mkdir -p ~/.R
        {
          echo "CPPFLAGS += -Xclang -fopenmp -I${LOMP}/include"
          echo "LDFLAGS += -L${LOMP}/lib -lomp -Wl,-rpath,${LOMP}/lib"
        } >> ~/.R/Makevars
        Rscript -e 'install.packages("TMB", type = "source", repos = "https://cloud.r-project.org", lib = .libPaths()[1])'
        Rscript -e 'so <- system.file("libs", "TMB.so", package = "TMB"); cat("TMB.so:", so, "\n"); cat(system2("otool", c("-L", so), stdout = TRUE), sep = "\n"); library(TMB); cat("TMB", as.character(packageVersion("TMB")), "loads OK\n")'
      shell: bash

    - name: Session info
      if: ${{ inputs.mode == 'check' || inputs.mode == 'pkgdown' }}
      # Written OUTSIDE the package tree: a top-level session-info.txt would be
      # picked up by R CMD build and flagged as a non-standard top-level file.
      run: |
        Rscript -e 'writeLines(capture.output(sessionInfo()), file.path(Sys.getenv("RUNNER_TEMP"), "session-info.txt"))'
        cat "${RUNNER_TEMP}/session-info.txt"
      shell: bash

    - name: Lint package (Linux only)
      if: ${{ runner.os == 'Linux' && inputs.mode == 'check' && inputs.run-lint == 'true' }}
      run: |
        Rscript -e 'lintr::lint_package()'
      shell: bash

    - name: URL check (Linux only, informational)
      if: ${{ runner.os == 'Linux' && inputs.mode == 'check' && inputs.run-urlcheck == 'true' }}
      # Informational: the package's own pkgdown-root URLs 404 until the master
      # push deploys the site, and some publisher DOIs 403 to bots. Real URL
      # problems are caught by the local gauntlet / win-builder before submit.
      continue-on-error: true
      run: |
        Rscript -e 'print(urlchecker::url_check())'
      shell: bash

    - name: Build source tarball (no manual)
      if: ${{ inputs.mode == 'check' && inputs.build-manual != 'true' }}
      run: |
        set -euo pipefail
        rm -rf ./*.Rcheck ./*.tar.gz || true
        R CMD build --no-manual .
      shell: bash

    - name: Build source tarball (with PDF manual)
      if: ${{ inputs.mode == 'check' && inputs.build-manual == 'true' }}
      run: |
        set -euo pipefail
        rm -rf ./*.Rcheck ./*.tar.gz || true
        R CMD build --manual .
      shell: bash

    - name: CRAN-style check
      if: ${{ inputs.mode == 'check' }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        TARBALLS=(./*.tar.gz)
        if (( ${#TARBALLS[@]} != 1 )); then
          echo "Expected exactly 1 tarball, found ${#TARBALLS[@]}."
          ls -la ./*.tar.gz || true
          exit 1
        fi
        TARBALL="${TARBALLS[0]}"
        # TinyTeX is installed only when build-manual == "true"; without it
        # R (>= 4.6) turns the PDF-manual check into an ERROR, so skip the
        # manual here (it is verified locally and by win-builder).
        MANUAL_ARGS=""
        if [ "${{ inputs.build-manual }}" != "true" ]; then MANUAL_ARGS="--no-manual"; fi
        R CMD check ${{ inputs.check-args }} ${MANUAL_ARGS} "${TARBALL}"
      shell: bash
      env:
        # R >= 4.6 fetches <CRAN>/src/contrib/Meta/current.rds during the
        # incoming-feasibility check; with use-public-rspm the CRAN repo is
        # Posit PPM, which does not serve it (404) and the whole check aborts.
        # The remote half of the incoming check (URLs, CRAN version compare)
        # is covered by the urlchecker step, win-builder and the local
        # gauntlet; keep the local half.
        _R_CHECK_CRAN_INCOMING_REMOTE_: "false"

    - name: Build pkgdown site
      if: ${{ inputs.mode == 'pkgdown' }}
      env:
        PKGDOWN_DEST: ${{ inputs.pkgdown-dest }}
      run: |
        Rscript -e 'pkgdown::build_site(preview = FALSE, override = list(destination = Sys.getenv("PKGDOWN_DEST")))'
      shell: bash
